name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Every dependency's licence; fails on GPL or AGPL (CLAUDE.md, Licences).
      - run: npm run check:licenses
      # Every file under library/ has its source and the fields its kind requires.
      - run: npm run check:library
      - run: npm run build
      - run: npm run build:site
      - name: The committed site is up to date
        run: git diff --exit-code -- site

  # The built Electron app driven through the main workflows (e2e/*.e2e.ts).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            out/e2e-results
            out/e2e-report
          retention-days: 7
